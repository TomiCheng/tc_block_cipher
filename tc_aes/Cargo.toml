[package]
name = "tc_aes"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "AES-128, AES-192 and AES-256 block ciphers with AES-NI, RustCrypto, table-based and small-footprint engines."
readme = "README.md"
documentation = "https://docs.rs/tc_aes"
keywords = ["aes", "block-cipher", "cryptography", "no-std", "aes-ni"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "benches/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
rustcrypto = ["dep:aes", "aes/zeroize"]

[dependencies]
tc_block_cipher = { path = "../tc_block_cipher", version = "0.1.0" }
tc_zeroize = "0.1.0"
aes = { version = "0.9", optional = true }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
tc_runtime = "0.1.0"

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "aes"
harness = false
