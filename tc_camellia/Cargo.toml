[package]
name = "tc_camellia"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Camellia-128, Camellia-192 and Camellia-256 block ciphers (RFC 3713) with table, small-footprint and RustCrypto engines."
readme = "README.md"
documentation = "https://docs.rs/tc_camellia"
keywords = ["camellia", "block-cipher", "cryptography", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "benches/**", "README.md", "BENCHES.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
rustcrypto = ["dep:camellia", "camellia/zeroize"]

[dependencies]
tc_block_cipher = { version = "0.1.0", path = "../tc_block_cipher" }
tc_zeroize = "0.1.0"
camellia = { version = "0.2", optional = true }

[dev-dependencies]
camellia = "0.2"
criterion.workspace = true

[[bench]]
name = "camellia"
harness = false
