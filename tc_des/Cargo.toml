[package]
name = "tc_des"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DES and Triple DES block ciphers for legacy interoperability, with table-based and RustCrypto engines."
readme = "README.md"
documentation = "https://docs.rs/tc_des"
keywords = ["des", "triple-des", "block-cipher", "cryptography", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
rustcrypto = ["dep:des", "des/zeroize"]

[dependencies]
tc_block_cipher = { version = "0.1.0", path = "../tc_block_cipher" }
tc_zeroize = "0.1.0"
des = { version = "0.9", optional = true }

